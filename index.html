<style>
:root { color-scheme: light; --s1:#e8863a; --s2:#2f8f6b; --ink:#2b2b2b; --sub:#767676; --bg:#faf7f2; --card:#ffffff; --line:#eee4d8; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);padding:20px;font-size:14px}
h1{font-size:20px;margin-bottom:2px}
.sub{color:var(--sub);font-size:12px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .lbl{font-size:11px;color:var(--sub)}
.kpi .val{font-size:20px;font-weight:700;margin-top:2px}
.kpi .s{font-size:11px;color:var(--sub);margin-top:2px}
.two{grid-template-columns:1fr 1fr;margin-bottom:16px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
h2{font-size:14px;margin-bottom:10px}
.chart-wrap{position:relative;height:260px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--sub);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.footer{color:var(--sub);font-size:11px;margin-top:14px}
.rhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.ravg{font-size:26px;font-weight:700}
.rtotal{color:var(--sub);font-size:12px}
.rbar{display:flex;align-items:center;gap:6px;margin:3px 0}
.rlbl{font-size:11px;color:var(--sub);width:26px}
.rtrack{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.rfill{height:100%;border-radius:4px}
.rnum{font-size:11px;color:var(--sub);width:24px;text-align:right}
.rmon{margin:10px 0 6px}
.rc{border-top:1px solid var(--line);padding:7px 2px}
.rc-h{font-size:11.5px;color:#c98a2e;margin-bottom:2px}
.rc-h span{color:var(--sub);margin-left:6px}
.rc-d{float:right}
.rc-b{font-size:12.5px;white-space:pre-wrap}
.rc-low{background:#fdf0ee;border-radius:6px;padding:7px 8px}
.rc-low .rc-h{color:#c0392b}
</style>
</head>
<body>
<h1>ケータリング2店舗 売上ダッシュボード</h1>
<div class="sub" id="updated"></div>

<div class="grid kpis" id="kpis"></div>

<div class="grid two">
  <div class="card"><h2>日次売上(直近30日)</h2><div class="chart-wrap"><canvas id="dailyChart"></canvas></div></div>
  <div class="card"><h2>月次売上</h2><div class="chart-wrap"><canvas id="monthlyChart"></canvas></div></div>
</div>

<div class="grid two">
  <div class="card"><h2><span class="tag" style="background:var(--s1)"></span>Osaka Rice Wok — 商品別出数</h2><div class="chart-wrap"><canvas id="items1"></canvas></div></div>
  <div class="card"><h2><span class="tag" style="background:var(--s2)"></span>Takumi Nori Bento — 商品別出数</h2><div class="chart-wrap"><canvas id="items2"></canvas></div></div>
</div>

<div class="grid two" id="reviewSec" style="display:none">
  <div class="card"><h2><span class="tag" style="background:var(--s1)"></span>Osaka Rice Wok — 口コミ</h2><div id="rev1"></div></div>
  <div class="card"><h2><span class="tag" style="background:var(--s2)"></span>Takumi Nori Bento — 口コミ</h2><div id="rev2"></div></div>
</div>

<div class="card" style="margin-bottom:16px"><h2>リピート状況</h2><table id="repeat"></table></div>
<div class="grid two">
  <div class="card"><h2><span class="tag" style="background:var(--s1)"></span>Osaka Rice Wok — トップ顧客(注文回数)</h2><table id="topcust1"></table></div>
  <div class="card"><h2><span class="tag" style="background:var(--s2)"></span>Takumi Nori Bento — トップ顧客(注文回数)</h2><table id="topcust2"></table></div>
</div>

<div class="footer">データ元: Capichi 店舗管理画面(自動集計)。売上は完了注文の合計金額(VND)。リピート率 = 2回以上注文した顧客の割合(電話番号ベース)。</div>

// reviews
const esc = t => (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function reviewHtml(store, color){
 const rv = store.reviews; if (!rv) return '<div class="rtotal">口コミデータなし</div>';
 const total = rv.total || 0;
 let h = '<div class="rhead"><span class="ravg">★'+Number(rv.avg).toFixed(1)+'</span><span class="rtotal">('+total+' レビュー)</span>'
   + (rv.low && rv.low.length ? '<span class="rtotal" style="color:#c0392b">低評価(★3以下) '+rv.low.length+'件</span>' : '')+'</div>';
 h += [5,4,3,2,1].map(k=>{const n=(rv.stars&&rv.stars[k])||0;const pct=total?Math.round(n/total*100):0;
   return '<div class="rbar"><span class="rlbl">★'+k+'</span><div class="rtrack"><div class="rfill" style="width:'+pct+'%;background:'+color+'"></div></div><span class="rnum">'+n+'</span></div>';}).join('');
 if (rv.monthly && rv.monthly.length) {
   h += '<table class="rmon"><tr><th>月</th><th class="num">件数</th><th class="num">平均</th></tr>'
     + rv.monthly.slice(-6).map(m=>'<tr><td>'+m.m+'</td><td class="num">'+m.n+'</td><td class="num">★'+Number(m.avg).toFixed(2)+'</td></tr>').join('')+'</table>';
 }
 const coms = (rv.comments||[]).concat((rv.low||[]).filter(l=>!(rv.comments||[]).some(c=>c.d===l.d&&c.fb===l.fb)));
 h += coms.map(c=>'<div class="rc'+(c.s<=3?' rc-low':'')+'"><div class="rc-h">'+'★'.repeat(c.s)+'<span>'+esc(c.nm)+'</span><span class="rc-d">'+c.d+'</span></div><div class="rc-b">'+esc(c.fb)+'</div></div>').join('');
 return h;
}
